{% extends "base.html" %}
{% block title %}短文阅读{% endblock %}

{% block extra_css %}
<style>
  /* ==================== OpenAI-style minimal ==================== */
  .passage-page {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 120px;
    min-height: calc(100vh - 80px);
    display: flex;
    flex-direction: column;
  }

  /* --- center stage --- */
  .passage-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .passage-placeholder {
    text-align: center;
    color: var(--text-muted);
    font-size: 1rem;
    padding: 80px 20px;
  }

  .passage-placeholder .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* --- passage card --- */
  .passage-card {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 36px 40px;
    margin-bottom: 24px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .passage-card-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .passage-card-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  .passage-text {
    font-size: 1rem;
    line-height: 2;
    color: var(--text);
  }

  .passage-text .word-unknown {
    font-weight: 700;
    color: var(--text);
    border-bottom: 2px solid var(--accent);
    padding: 0 1px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .passage-text .word-unknown:hover {
    background: var(--accent-light);
    border-radius: 3px;
  }

  .passage-text .word-unknown .tooltip {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 400;
    white-space: nowrap;
    z-index: 10;
    margin-bottom: 6px;
  }

  .passage-text .word-unknown:hover .tooltip {
    display: block;
  }

  .passage-divider {
    border: none;
    border-top: 1px solid var(--border-light);
    margin: 28px 0;
  }

  .passage-translation {
    font-size: 0.95rem;
    line-height: 1.9;
    color: var(--text-secondary);
  }

  /* --- illustration --- */
  .passage-illustration {
    margin-top: 24px;
    text-align: center;
    padding: 16px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
  }

  .passage-illustration svg {
    max-width: 100%;
    height: auto;
  }

  /* --- prompt area (always visible) --- */
  .prompt-section {
    margin-top: 48px;
    border-top: 1px solid var(--border-light);
    padding-top: 24px;
  }

  .prompt-label {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-weight: 500;
  }

  .prompt-editor textarea {
    width: 100%;
    min-height: 180px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.82rem;
    font-family: 'SF Mono', 'Monaco', monospace;
    line-height: 1.6;
    resize: vertical;
    background: var(--bg-secondary);
    color: var(--text);
  }

  .prompt-editor textarea:focus {
    outline: none;
    border-color: var(--text-muted);
    background: var(--bg);
  }

  .prompt-hint {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* --- details (bottom-right) --- */
  .details-fab {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 50;
  }

  .details-fab .hint-bubble {
    position: absolute;
    bottom: calc(100% + 10px);
    right: 0;
    background: #1a1a1a;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.78rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .details-fab:hover .hint-bubble {
    opacity: 1;
  }

  .details-fab button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: var(--shadow-md);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .details-fab button:hover {
    background: var(--bg-secondary);
    border-color: var(--text-muted);
    color: var(--text);
  }

  /* --- debug panel --- */
  .debug-panel {
    position: fixed;
    bottom: 80px;
    right: 28px;
    width: 500px;
    max-height: 60vh;
    background: #1a1a1a;
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    z-index: 150;
    display: none;
    overflow: hidden;
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 0.75rem;
  }

  .debug-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #2a2a2a;
    color: #e5e7eb;
    border-bottom: 1px solid #3a3a3a;
  }

  .debug-header button {
    background: none;
    border: 1px solid #4b5563;
    color: #9ca3af;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.7rem;
  }

  .debug-header button:hover {
    background: #3a3a3a;
    color: #e5e7eb;
  }

  .debug-body {
    padding: 12px;
    overflow-y: auto;
    max-height: calc(60vh - 50px);
  }

  .debug-item {
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #3a3a3a;
  }

  .debug-item:last-child {
    border-bottom: none;
  }

  .debug-item-header {
    color: #f59e0b;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .debug-item details {
    margin-bottom: 6px;
  }

  .debug-item summary {
    color: #9ca3af;
    cursor: pointer;
    padding: 4px 0;
  }

  .debug-item summary:hover {
    color: #e5e7eb;
  }

  .debug-item pre {
    background: #0d0d0d;
    padding: 10px;
    border-radius: 4px;
    color: #d1d5db;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
    margin: 6px 0;
  }

  .debug-meta {
    color: #6b7280;
    font-size: 0.65rem;
    margin-top: 6px;
  }

  /* --- details modal --- */
  .details-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 200;
    justify-content: center;
    align-items: center;
  }

  .details-overlay.open {
    display: flex;
  }

  .details-panel {
    background: var(--bg);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    width: 560px;
    max-width: 90vw;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .details-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-light);
  }

  .details-header h3 {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
  }

  .details-header .close-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }

  .details-header .close-btn:hover {
    background: var(--bg-secondary);
    color: var(--text);
  }

  .details-body {
    padding: 20px 24px;
    overflow-y: auto;
    flex: 1;
  }

  .details-empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 40px 0;
  }

  .details-item {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;
    transition: color 0.15s;
  }

  .details-item:last-child {
    border-bottom: none;
  }

  .details-item-content {
    flex: 1;
    min-width: 0;
  }

  .details-item:hover .details-item-title {
    color: var(--accent);
  }

  .details-item-title {
    font-size: 0.88rem;
    font-weight: 500;
    margin-bottom: 4px;
    transition: color 0.15s;
  }

  .details-item-meta {
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  .details-item-delete {
    width: 24px;
    height: 24px;
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 1rem;
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 8px;
    flex-shrink: 0;
  }

  .details-item-delete:hover {
    background: var(--danger-light);
    color: var(--danger);
  }

  /* --- responsive --- */
  @media (max-width: 640px) {
    .passage-page { padding: 32px 16px 100px; }
    .passage-card { padding: 24px 20px; }
  }

  /* --- error state --- */
  .error-card {
    border: 1px solid var(--danger-light);
    background: var(--danger-light);
  }

  .error-card .passage-card-title {
    color: var(--danger);
  }
</style>
{% endblock %}

{% block content %}
<div class="passage-page" id="passagePage">

  <!-- center stage -->
  <div class="passage-stage" id="passageStage">
    <div class="passage-placeholder">
      <div class="spinner"></div>
      <div>正在生成短文...</div>
    </div>
  </div>

  <!-- prompt area (always visible) -->
  <div class="prompt-section">
    <div class="prompt-label">提示词设置</div>
    <div class="prompt-editor">
      <textarea id="promptTemplate" spellcheck="false"></textarea>
      <div class="prompt-hint">刷新页面或点击右下角 📚 查看已保存短文</div>
    </div>
  </div>

  <!-- details FAB (bottom-right) -->
  <div class="details-fab" id="detailsFab" style="display:none;">
    <span class="hint-bubble">查看已保存短文 →</span>
    <button onclick="openDetails()" title="详情">📚</button>
  </div>

  <!-- details modal -->
  <div class="details-overlay" id="detailsOverlay" onclick="closeDetails(event)">
    <div class="details-panel" onclick="event.stopPropagation()">
      <div class="details-header">
        <h3>已保存短文</h3>
        <button class="close-btn" onclick="closeDetails()">×</button>
      </div>
      <div class="details-body" id="detailsBody">
        <div class="details-empty">暂无保存的短文</div>
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
// ==================== state ====================
let currentPassage = null;
let passages = [];

// ==================== KET themes ====================
const KET_THEMES = [
  { id: 'daily_routine', label: '日常生活' },
  { id: 'shopping', label: '购物消费' },
  { id: 'food_drink', label: '饮食' },
  { id: 'health', label: '健康' },
  { id: 'hobbies', label: '爱好休闲' },
  { id: 'travel', label: '旅行度假' },
  { id: 'clothes', label: '服饰穿搭' },
  { id: 'school', label: '学校学习' },
  { id: 'family', label: '家人朋友' },
  { id: 'weather', label: '天气季节' },
  { id: 'home', label: '家庭生活' },
  { id: 'work', label: '工作职业' },
  { id: 'nature', label: '自然世界' },
  { id: 'sports', label: '体育运动' },
  { id: 'entertainment', label: '娱乐活动' },
  { id: 'transport', label: '交通出行' },
  { id: 'animals', label: '动物植物' },
  { id: 'technology', label: '通讯技术' }
];

const DEFAULT_PROMPT = `Write a short English story (300-400 words) for KET-level learners.

Words to include (bold with **word**): {words}
Error words (use ≥3 times each): {wrong_words}

CRITICAL RULES:
1. Start DIRECTLY with the story - first word should be a character name or "Once" or "One day"
2. NO thinking, NO planning, NO reasoning, NO explanation before or after the story
3. NO word frequency counts, NO usage notes, NO annotations like (1) (2) (M)
4. NO bullet points, NO lists, NO meta-commentary
5. Fun and simple grammar suitable for KET-level learners
6. Output ONLY the story text, nothing else

Example of CORRECT output:
"Once upon a time, there was a young girl named Sarah. She worked as a waitress..."

Example of WRONG output:
"Let me plan this story first. I need to include these words..."
"- quarter: I will use this 3 times"
"Lucy is a waitress (1) at a restaurant"

Now write the story:`;

// ==================== init ====================
document.addEventListener('DOMContentLoaded', function() {
  if (!document.getElementById('promptTemplate').value) {
    document.getElementById('promptTemplate').value = DEFAULT_PROMPT;
  }
  loadPassages();
  generatePassage();  // auto-generate on page load
});

// ==================== generate passage ====================
async function generatePassage() {
  const stage = document.getElementById('passageStage');
  const placeholder = document.getElementById('placeholder');

  // show loading
  stage.innerHTML = '<div class="passage-placeholder"><div class="spinner"></div><div>正在生成短文...</div></div>';
  document.getElementById('detailsFab').style.display = 'none';

  // pick random KET theme
  const theme = KET_THEMES[Math.floor(Math.random() * KET_THEMES.length)];

  const prompt = document.getElementById('promptTemplate').value;

  try {
    const r = await fetch('/api/passages/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        difficulty: 'intermediate',
        custom_prompt: prompt,
        theme: theme.id,
        theme_label: theme.label
      })
    });
    const data = await r.json();

    if (data.success) {
      currentPassage = { ...data, theme: theme.label };
      showPassage(data, theme);
      document.getElementById('detailsFab').style.display = 'block';
    } else {
      showError(data.message || '生成失败');
    }
  } catch (e) {
    showError('请求失败: ' + e.message);
  }
}

function showPassage(data, theme) {
  const stage = document.getElementById('passageStage');

  let englishText = '';
  let chineseText = '';

  if (data.content) {
    const engMatch = data.content.match(/(?:English|英文)[：:]\s*([\s\S]*?)(?:Chinese|中文|$)/i);
    const chnMatch = data.content.match(/(?:Chinese|中文)[：:]\s*([\s\S]*?)(?:📝|Word Check|$)/i);
    if (engMatch && chnMatch) {
      englishText = engMatch[1].trim();
      chineseText = chnMatch[1].trim();
    } else {
      englishText = data.content;
      chineseText = data.translation || '';
    }
  }

  // Process: bold unknown words + add tooltips
  const formatEnglish = (text) => {
    return text
      .replace(/\*\*(.*?)\*\*/g, function(m, word) {
        const meaning = getWordMeaning(word);
        return `<span class="word-unknown">${word}<span class="tooltip">${meaning}</span></span>`;
      })
      .replace(/\n/g, '<br>');
  };

  const formatChinese = (text) => {
    // 清理 markdown 标记：**bold** → 纯文本
    return text
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/\n/g, '<br>');
  };

  stage.innerHTML = `
    <div class="passage-card">
      <div class="passage-card-title">${escapeHtml(data.title || '短文')}</div>
      <div class="passage-card-meta">
        ${theme.label} · ${(data.words_used || []).length} 个目标单词
      </div>
      <div class="passage-text">${formatEnglish(englishText)}</div>
      <hr class="passage-divider">
      <div class="passage-translation">${formatChinese(chineseText)}</div>
    </div>
    <div class="passage-illustration" id="passageIllustration">
      ${generateIllustration(theme.label)}
    </div>
  `;

  // 显示调试信息
  if (data.debug_info && data.debug_info.length > 0) {
    showDebugInfo(data.debug_info);
  }
}

// ==================== debug panel ====================
function showDebugInfo(debugInfo) {
  let debugPanel = document.getElementById('debugPanel');
  if (!debugPanel) {
    debugPanel = document.createElement('div');
    debugPanel.id = 'debugPanel';
    debugPanel.className = 'debug-panel';
    document.body.appendChild(debugPanel);
  }
  
  let html = '<div class="debug-header"><span>🔍 调试信息</span><button onclick="toggleDebug()">收起/展开</button></div>';
  html += '<div class="debug-body" id="debugBody">';
  
  debugInfo.forEach((info, i) => {
    html += `<div class="debug-item">
      <div class="debug-item-header">第 ${i + 1} 次调用 ${info.attempt > 1 ? `(重试 ${info.attempt})` : ''}</div>
      ${info.thinking ? `<details><summary>💭 Thinking (${info.thinking.length} 字符)</summary><pre>${escapeHtml(info.thinking)}</pre></details>` : ''}
      <details><summary>📤 Prompt (${info.prompt.length} 字符)</summary><pre>${escapeHtml(info.prompt)}</pre></details>
      <details open><summary>📥 响应 (${info.content.length} 字符, ${info.tokens} tokens)</summary><pre>${escapeHtml(info.content)}</pre></details>
      <div class="debug-meta">模型: ${info.model} | Tokens: ${info.tokens}</div>
    </div>`;
  });
  
  html += '</div>';
  debugPanel.innerHTML = html;
  debugPanel.style.display = 'block';
}

function toggleDebug() {
  const body = document.getElementById('debugBody');
  if (body) {
    body.style.display = body.style.display === 'none' ? 'block' : 'none';
  }
}

function showError(msg) {
  const stage = document.getElementById('passageStage');
  stage.innerHTML = `
    <div class="passage-card error-card">
      <div class="passage-card-title">生成失败</div>
      <div style="color:var(--danger);font-size:0.9rem;">${escapeHtml(msg)}</div>
    </div>
  `;
}

// ==================== details (saved passages) ====================
function openDetails() {
  document.getElementById('detailsOverlay').classList.add('open');
  renderDetails();
}

function closeDetails(e) {
  if (!e || e.target === document.getElementById('detailsOverlay')) {
    document.getElementById('detailsOverlay').classList.remove('open');
  }
}

function renderDetails() {
  const body = document.getElementById('detailsBody');
  if (passages.length === 0) {
    body.innerHTML = '<div class="details-empty">暂无保存的短文</div>';
    return;
  }
  body.innerHTML = passages.map((p, i) => `
    <div class="details-item">
      <div class="details-item-content" onclick="showSavedPassage(${i})">
        <div class="details-item-title">${escapeHtml(p.title || '短文')}</div>
        <div class="details-item-meta">${p.theme || '—'} · ${(p.words_list || []).length} 词</div>
      </div>
      <button class="details-item-delete" onclick="deletePassageById(${p.id}, event)">×</button>
    </div>
  `).join('');
}

async function deletePassageById(id, event) {
  event.stopPropagation();
  try {
    const r = await fetch(`/api/passages/${id}`, { method: 'DELETE' });
    const data = await r.json();
    if (data.success) {
      showToast('已删除', 'success');
      loadPassages();
    } else {
      showToast('删除失败', 'error');
    }
  } catch (e) {
    showToast('删除失败', 'error');
  }
}

function showSavedPassage(index) {
  const p = passages[index];
  if (!p) return;
  closeDetails();
  currentPassage = p;
  const stage = document.getElementById('passageStage');
  const formatEnglish = (text) => text.replace(/\*\*(.*?)\*\*/g, function(m, w) {
    return `<span class="word-unknown">${w}<span class="tooltip">${getWordMeaning(w)}</span></span>`;
  }).replace(/\n/g, '<br>');

  stage.innerHTML = `
    <div class="passage-card">
      <div class="passage-card-title">${escapeHtml(p.title || '短文')}</div>
      <div class="passage-card-meta">${p.theme || '—'} · ${(p.words_list || []).length} 词</div>
      <div class="passage-text">${formatEnglish(p.content || '')}</div>
      ${p.translation ? `<hr class="passage-divider"><div class="passage-translation">${p.translation.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\n/g, '<br>')}</div>` : ''}
    </div>
  `;
}

async function loadPassages() {
  try {
    const r = await fetch('/api/passages');
    const data = await r.json();
    if (data.success) {
      passages = data.passages;
    }
  } catch (e) {
    console.error('加载失败:', e);
  }
}

// ==================== helpers ====================
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Word meaning lookup
const WORD_MEANINGS = {};
function getWordMeaning(word) {
  return WORD_MEANINGS[word.toLowerCase()] || '';
}
