<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}英语听写练习{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo"><span>📝</span>英语听写练习</a>
            <ul class="nav-links">
                <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">📥 单词录入</a></li>
                <li><a href="/dictation" class="{% if request.path == '/dictation' %}active{% endif %}">✏️ 开始听写</a></li>
                <li><a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">📊 报表</a></li>
                <li><a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">⚙️ 设置</a></li>
                <li><a href="/passages" class="{% if request.path == '/passages' %}active{% endif %}">📖 短文</a></li>
                <li><a href="/observability" class="{% if request.path == '/observability' %}active{% endif %}">🔍 可观测性</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
